# The documentation gate. `docs/` lives inside this repository, so `make check` needs no arguments;
# the anchors job at the bottom is the one part that had to be rewritten from the template, because
# shashki's anchors point at *other* repositories rather than at this one.

name: check

# **No path filters.** A filter saves seconds and buys red default branches. Two changes that are
# each harmless alone disagree once merged; a generated index diverges from its sources when
# something outside the listed paths moves; and a document at the root of the tree is exactly the
# one nobody remembers to add to the list, so the check that would have caught it never runs.
# Sixty documents are checked in seconds. There is nothing here worth economising on.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"          # Monday morning, for the anchors job below
  workflow_dispatch:

jobs:
  # The gate. Exactly the target a contributor runs: a local check set that differs from the CI one
  # turns "green here, red there" into the normal state of affairs, and then neither is read.
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      # BEFORE `make check`, and that order is the whole value of this step. Both checks catch a
      # number taken twice, but this one says *which branch took it and under what name*, while the
      # gate says `duplicate ids: B-06`. A failing step stops the job, so whichever runs first is
      # the message the author gets.
      #
      # Pull requests only, and only when the backlog is a file per item. Read the note below
      # before deciding whether you need it at all.
      #
      # The refspec is explicit on purpose: `git fetch origin main` moves FETCH_HEAD and creates no
      # remote-tracking ref, so the next line would fail with "could not read origin/main". The
      # check reads a tree rather than a history, so the shallow clone checkout makes is enough and
      # `fetch-depth: 0` is not needed.
      - if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          python3 scripts/backlog_index.py --against "origin/$GITHUB_BASE_REF"

      # WHEN THE STEP ABOVE IS WORTH HAVING. It pays for itself only if the generated index is not
      # committed from the branch — for instance when the default branch rebuilds and commits it
      # itself. If every branch commits the regenerated `backlog.md`, then two branches that each
      # add an item always conflict in that one file, and two things follow, both observed:
      #
      #   * a pull request that cannot be merged gets no `pull_request` run at all, so this step
      #     does not run precisely when the branches have diverged most;
      #   * once the conflict is resolved, the ordinary duplicate-id check inside `make check`
      #     catches the collision anyway.
      #
      # So with a branch-committed index the conflict is the real guard and this step is a
      # backstop. Keep it — it is cheap and it explains itself better — but do not rely on it as
      # the only thing standing between two branches and one number.

      - run: make check

      # Default branch only. `status: draft` is legal in a pull request, where it means "this
      # branch will make it true", and a defect the moment it merges.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python3 scripts/docs_check.py --on-main

  # The code gate, beside the documentation one. Two jobs and not two steps of one: they fail for
  # unrelated reasons and a contributor runs them separately, so a red build should say which half.
  #
  # **`ubuntu-latest`, decided rather than defaulted.** The label follows the repository's
  # *visibility* and not the account: a private repository's `ubuntu-latest` job does not start at
  # all while the account's Actions minutes are unpaid, and a self-hosted label on a repository with
  # no runners parks every run in `queued` — which reads exactly like success and is worse than a
  # failure. A public repository gets GitHub's standard runners for free, so this is the right label
  # for the one this is going to be. It stops being right if the repository is ever made private,
  # and the check for that is `gh repo view --json isPrivate` plus confirming a run **finished**
  # rather than merely that it is not red.
  gradle:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Not `build`: `check` is the target a contributor runs, and the distribution is not something
      # a pull request needs built.
      #
      # `viddikVerify` is deliberately **not** here yet. The goldens were recorded on one machine and
      # whether they mean the same thing on another is an open measurement — B-02 — so wiring the
      # comparison in now would either redden every run or, worse, pass for a reason nobody checked.
      - run: ./gradlew check --no-daemon

  # Separate from the gate, and on a schedule rather than on a pull request, because an anchor rots
  # when somebody refactors a **different** repository. A pull request here is the least likely
  # moment for one to break, and running it there trains people to ignore a red build they did not
  # cause. It also does not block: a path quoted *as obsolete* is indistinguishable from a live one
  # by machine, so the report is read by a person. Add `--check` once the stale list reaches zero.
  anchors:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      # **The anchors point out of this repository, not into it.** While there is no shashki source
      # tree, every path in the research names a file in one of the stack's own repositories, so the
      # template's `--repos ..` — whose parent holds only this checkout — would report all of them
      # missing. Shallow clones instead: history is not needed, only the file tree.
      #
      # A repository that cannot be cloned is a warning and not a failure. Its anchors are then
      # simply unchecked, which is the truth, and a weekly red build nobody caused is a weekly red
      # build people learn to skip.
      #
      # `smtpkn` is cloned under its own name: the anchors that reach into it are written without a
      # leading repository segment, because matching is by suffix and the directory a working copy
      # sits in is not this repository's business.
      - run: |
          mkdir -p repos && cd repos
          for r in kvadrant-ui viddik kompot petich booblik bochka s3kn shildik katcher metrik tracy telek smtpkn; do
            git clone --depth 1 --filter=blob:none \
              "https://github.com/${{ github.repository_owner }}/$r.git" \
              || echo "::warning::$r is unreachable - its anchors were not checked"
          done

      - run: python3 scripts/code_anchors.py --repos repos
