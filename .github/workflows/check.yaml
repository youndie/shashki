# The documentation gate and the code gate. The documentation checks are docs-bootstrap's, at the
# version the `uses: youndie/docs-bootstrap@...` lines below pin - written here and nowhere else: the
# Makefile reads the same line and fetches the same version for a local `make check`, and Renovate
# bumps it. The anchors job at the bottom differs from the template because shashki's anchors point
# into the stack's other repositories as well as into this one.

name: check

# **No path filters.** A filter saves seconds and buys red default branches. Two changes that are
# each harmless alone disagree once merged; a generated index diverges from its sources when
# something outside the listed paths moves; and a document at the root of the tree is exactly the
# one nobody remembers to add to the list, so the check that would have caught it never runs.
# Sixty documents are checked in seconds. There is nothing here worth economising on.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"          # Monday morning, for the anchors job below
  workflow_dispatch:

jobs:
  # The gate. The action runs `make check` - exactly the target a contributor runs, so that "green
  # here, red there" cannot become the normal state of affairs - and around it the two checks that
  # depend on the event: on a pull request, backlog item numbers against the base branch, BEFORE the
  # gate; on a push to `main`, `status: draft` as an error. Why each sits where it does, and when the
  # first is only a backstop, is written next to the step in docs-bootstrap's action.yml.
  #
  # shashki's own checks (`style_contract.py`, `chart_config.py`) are lines of `gate` in the Makefile,
  # not steps here, so a contributor runs them too.
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: youndie/docs-bootstrap@v0.3.0

      # **The chart, with the values a real installation sets.** `make check` holds the chart's
      # environment to the server's (`chart_config.py`) and cannot render it: that needs Helm, and a
      # documentation gate that needed Helm would be a gate somebody skips. The runner has it.
      - run: |
          helm lint charts/shashki \
            --set database.jdbcUrl=jdbc:postgresql://pg:5432/shashki \
            --set ingress.host=shashki.example
          helm template shashki charts/shashki \
            --set database.jdbcUrl=jdbc:postgresql://pg:5432/shashki \
            --set ingress.host=shashki.example > /dev/null

  # The code gate, beside the documentation one. Two jobs and not two steps of one: they fail for
  # unrelated reasons and a contributor runs them separately, so a red build should say which half.
  #
  # **`ubuntu-latest`, decided rather than defaulted.** The label follows the repository's
  # *visibility* and not the account: a private repository's `ubuntu-latest` job does not start at
  # all while the account's Actions minutes are unpaid, and a self-hosted label on a repository with
  # no runners parks every run in `queued` — which reads exactly like success and is worse than a
  # failure. A public repository gets GitHub's standard runners for free, so this is the right label
  # for the one this is going to be. It stops being right if the repository is ever made private,
  # and the check for that is `gh repo view --json isPrivate` plus confirming a run **finished**
  # rather than merely that it is not red.
  gradle:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # **The browser the wasm suite runs in, pinned and fetched the same way the build box fetches
      # it.** The runner image ships a Chrome of its own; using it would mean the product's one
      # executed target ran in a different browser on every machine, and "it passes locally" would
      # stop meaning anything. The script is the same one a person runs — a browser that exists
      # because somebody typed a command once is a build that breaks on the next machine (B-34).
      - run: |
          bash scripts/install-chrome.sh
          eval "$(bash scripts/install-chrome.sh --export)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      # Not `build`: `check` is the target a contributor runs, and the distribution is not something
      # a pull request needs built.
      #
      # `viddikVerify` is deliberately **not** here yet. The goldens were recorded on one machine and
      # whether they mean the same thing on another is an open measurement — B-02 — so wiring the
      # comparison in now would either redden every run or, worse, pass for a reason nobody checked.
      - run: ./gradlew check --no-daemon

      # **The image is built by CI and by nothing else that can forget.** `check` compiles the server
      # and the bundles; it does not put them in a container, and a Dockerfile that only ever runs on
      # one person's machine is a Dockerfile that stops working quietly. There is no extract here —
      # 41 MB is not in git (B-06) — so this builds the context and stops short of the graph, which
      # is the half a runner can check without downloading a city.
      - run: ./gradlew :server:installDist :rider:wasmJsBrowserDistribution :driver:wasmJsBrowserDistribution --no-daemon

  # Separate from the gate, and on a schedule rather than on a pull request, because an anchor rots
  # when somebody refactors a **different** repository. A pull request here is the least likely
  # moment for one to break, and running it there trains people to ignore a red build they did not
  # cause. It also does not block: a path quoted *as obsolete* is indistinguishable from a live one
  # by machine, so the report is read by a person. Pass `target: report ANCHORS_ARGS=--check` once
  # the stale list reaches zero.
  anchors:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # **This checkout goes into `repos/`, beside the clones below**, because the anchors point both
      # ways: into this tree (`server/src/...`, `rider/src/...`) and into the stack's own
      # repositories. The report resolves them against `REPOS` - `..` by default, the directory this
      # checkout sits in - so that directory has to hold all of them. With the checkout at the
      # workspace root and only the clones in `repos/`, every anchor into shashki itself was reported
      # missing.
      - uses: actions/checkout@v4
        with:
          path: repos/shashki

      # Shallow clones: history is not needed, only the file tree.
      #
      # A repository that cannot be cloned is a warning and not a failure. Its anchors are then
      # simply unchecked, which is the truth, and a weekly red build nobody caused is a weekly red
      # build people learn to skip.
      #
      # `smtpkn` is cloned under its own name: the anchors that reach into it are written without a
      # leading repository segment, because matching is by suffix and the directory a working copy
      # sits in is not this repository's business.
      - run: |
          cd repos
          for r in kvadrant-ui viddik kompot petich booblik bochka s3kn shildik katcher metrik tracy telek smtpkn; do
            git clone --depth 1 --filter=blob:none \
              "https://github.com/${{ github.repository_owner }}/$r.git" \
              || echo "::warning::$r is unreachable - its anchors were not checked"
          done

      - uses: youndie/docs-bootstrap@v0.3.0
        with:
          working-directory: repos/shashki
          target: report
