# The whole stand: shashki itself, and the three services it talks to.
#
# **`up` and a browser, which is what a reference owes a reader.** Until B-35 this file stood up the
# services shashki *talks to* and could not run shashki, because there was no image — so the demo was
# a repository, a Gradle daemon and four terminal windows.
#
#   docker compose -f docker/compose.yaml up -d
#   bash docker/bootstrap-shildik.sh
#   bash docker/upload-tiles.sh ~/shashki-city/Ljubljana.pmtiles
#   open http://127.0.0.1:18080          # the rider
#   open http://127.0.0.1:18080/driver   # the driver
#
# **Not a deployment.** Secrets are strings in this file, the database has no volume, and both of
# shildik's ports are published because there is nobody on this machine to protect them from.
#
# **The ports are high on purpose.** shashki's own server wants 8080, and a shared build box has
# other people's services on the obvious numbers — 8080 and 8081 were both taken by another project
# when this was written, and the only symptom was a container stuck in `Created` with an empty log.
#
# `SHILDIK_ISSUER` has to be the address a client actually reaches: it goes into every token as `iss`
# and the client compares it with what discovery says. Getting that wrong produces a sign-in that
# completes and a token nobody accepts.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: shildik
      POSTGRES_USER: shildik
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shildik"]
      interval: 2s
      timeout: 2s
      retries: 15

  shildik:
    # A numbered tag, not `latest`: a demo that cannot be stood up again in six months is a
    # screenshot of a demo (research §3 Risk 3).
    image: ghcr.io/youndie/shildik:0.2.0.8
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The address goes into every token as `iss` and into the discovery document as the host of
      # `jwks_uri`, so it is the one both the browser and the shashki container must be able to reach.
      SHILDIK_ISSUER: http://${SHASHKI_HOST:-127.0.0.1}:18081
      # Set explicitly, as shildik's own e2e harness does. Left out, the image died on start with a
      # panic from its native driver and nothing else in the log.
      SHILDIK_PORT: 8080
      SHILDIK_MANAGEMENT_PORT: 9000
      SHILDIK_JDBC_URL: jdbc:postgresql://postgres:5432/shildik
      SHILDIK_DB_USER: shildik
      SHILDIK_DB_PASSWORD: secret
      SHILDIK_MASTER_KEYS: change-me
      SHILDIK_BOOTSTRAP_TOKEN: bootstrap
    ports:
      # **Not loopback-bound, unlike everything else here.** A container cannot reach the host's
      # loopback, and this is the one service the shashki container has to call.
      - "18081:8080"
      - "127.0.0.1:19001:9000"

  # Where `city.pmtiles` lives. B-07 measured the load this takes — many small ranged reads into one
  # 16.6 MiB object — and found that the numbers were never the problem: **two switches are, and
  # both are off by default.** `BOCHKA_ANONYMOUS` alone leaves an unsigned GET at 403, because a
  # browser cannot sign a request; and without a CORS configuration the preflight is 403 and a plain
  # GET carrying `Origin` comes back with no `Access-Control-Allow-Origin` at all. `Range` is not on
  # the CORS safelist, so every single tile read is preflighted. A deployment that set the bucket
  # policy and forgot the CORS rule passes every `curl` check and fails in the product.
  #
  # `docker/upload-tiles.sh` sets both, and it has to be run: an empty store is not a broken one.
  bochka:
    image: ghcr.io/youndie/bochka:v0.5.0
    environment:
      # The key `map/tile_serving.py` signs with. In a deployment these go in a file behind
      # `BOCHKA_CONFIG` — passed here they are readable by anyone who can run `docker inspect`,
      # which on a laptop is the person who started it.
      BOCHKA_KEYS: shashki:shashkisecret
      BOCHKA_ANONYMOUS: "1"
    ports:
      - "127.0.0.1:19000:9000"

  # The broker a ride's own events go through (B-38). **Topics are fixed at startup** — booblik has
  # no topic creation on purpose — so `ride-events:3` is a deployment fact rather than a default the
  # application can arrange for itself. Three partitions because the key is the ride's id: everything
  # that happens to one ride lands on one partition, in order.
  booblik:
    image: ghcr.io/youndie/booblik:0.3.1
    environment:
      BOOBLIK_TOPICS: ride-events:3
    ports:
      - "127.0.0.1:19092:9092"

  # **Where the service is watched from** (B-39). Both take one ingest key per installation rather
  # than per service, and the service name *is* the identifier — there is no registration step, so a
  # typo in `SHASHKI_METRIK_ENDPOINT` creates a phantom service instead of an error.
  #
  # metrik ingests over **UDP**, which is why the shashki container is given `metrik:9999` and not a
  # URL: nothing about a datagram fails visibly, and a wrong address here looks exactly like a
  # service with no traffic. Check the dashboard, not the log.
  metrik:
    image: ghcr.io/youndie/metrik:latest
    environment:
      METRIK_INGEST_KEY: shashki-ingest
      METRIK_ADMINS: ""
    ports:
      - "127.0.0.1:19080:8080"
      - "127.0.0.1:19999:9999/udp"

  # tracy ingests over HTTP and keeps its spans in SQLite inside the container: no volume here for
  # the same reason the databases have none — this is a stand, and a trace older than the demo is
  # not interesting.
  tracy:
    image: ghcr.io/youndie/tracy:0.2.2
    environment:
      TRACY_INGEST_KEY: shashki-ingest
      # The **file**, not the directory it lives in: tracy opens exactly this path, and a directory
      # here dies on start with `unable to open database file` and a native stack trace.
      TRACY_DB_PATH: /tmp/tracy.db
    ports:
      - "127.0.0.1:19081:8080"

  # shashki's own database. A second Postgres rather than a second schema in shildik's: they are two
  # services, and a demo that shares one instance teaches the wrong shape for the sake of 30 MB.
  shashki-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: shashki
      POSTGRES_USER: shashki
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shashki"]
      interval: 2s
      timeout: 2s
      retries: 15

  # **Built, not pulled.** `./gradlew :server:image -PcommitSha=$(git rev-parse --short HEAD)` makes
  # it; the tag here has to name the same thing. `SHASHKI_IMAGE` is how a stand runs a specific
  # commit — the point of a tag that names one.
  shashki:
    image: ${SHASHKI_IMAGE:-shashki/server:dev}
    # **Never pull.** This image is built locally and published nowhere, so a compose that tried
    # would answer `pull access denied … or may require docker login` — a message about credentials
    # for a problem that is "you have not built it yet". `shashki/server:dev` is what
    # `./gradlew :server:image` tags when no commit is given, so the default here and the default
    # there are the same string on purpose.
    pull_policy: never
    depends_on:
      shashki-db:
        condition: service_healthy
      booblik:
        condition: service_started
      tracy:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://shashki-db:5432/shashki
      DB_USER: shashki
      DB_PASSWORD: secret
      # **One address for the provider, and it has to be one.** Giving the server an internal name
      # and the browser an external one does not work: the validator reads `jwks_uri` out of the
      # discovery document, which carries the *issuer's* own address — so a container that fetched
      # discovery from inside the network was then sent to an address only a browser can reach, and
      # answered 401 to every token.
      #
      # So `SHASHKI_HOST` is the machine's own address on its network: a container reaches it, and so
      # does a browser on that machine. `127.0.0.1` is the default and works for everything except
      # the container, which is why the stand asks for it:
      #
      #     SHASHKI_HOST=$(hostname -I | awk '{print $1}') docker compose up -d
      #
      # `bootstrap-shildik.sh` has to have run: a server pointed at a realm nobody created refuses
      # every token, and the redirect URI registered there must be this bundle's origin + `/callback`.
      SHASHKI_OIDC_ISSUER: http://${SHASHKI_HOST:-127.0.0.1}:18081
      #
      # Where the browser fetches tiles from. Not this server: B-07 settled that the archive is a
      # static object somewhere else, and 127.0.0.1 is the address a *browser* reaches bochka at.
      SHASHKI_TILES_URL: http://127.0.0.1:19000/tiles/Ljubljana.pmtiles
      # Without this the relay is not started at all and a ride's events stay in the outbox — which
      # is true, and is what a server with no broker should say rather than logging them delivered.
      SHASHKI_BOOBLIK: booblik:9092
      # Both absent is a running configuration and both say so on start — a service that silently
      # measures nothing and a service with no traffic look identical from a graph.
      SHASHKI_METRIK_ENDPOINT: metrik:9999
      SHASHKI_METRIK_KEY: shashki-ingest
      SHASHKI_TRACY_ENDPOINT: http://tracy:8080
      SHASHKI_TRACY_KEY: shashki-ingest
      # **Every trace kept, which a stand needs and a deployment must not have.** The agent's default
      # is 1%: it keeps failures and slow calls and drops successful fast ones, so a demo whose every
      # request succeeds in 20 ms shows an empty collector and reads as broken wiring.
      SHASHKI_TRACY_SAMPLE_RATE: "1.0"
    ports:
      - "127.0.0.1:18080:8080"
