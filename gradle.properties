org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# Not published. The group exists because the conventions ask for one and because the artefacts a
# local build produces have to be named something; nothing here goes to a repository. Open question
# 4 of the research asks whether the protocol ever becomes a published artefact, and until it is
# answered this stays an application's group rather than a library's.
sborka.group=io.github.youndie
sborka.repository=youndie/shashki
sborka.description=A reference ride-hailing service on the kotlin.website stack.
sborka.inceptionYear=2026
sborka.licence=The Apache License, Version 2.0

# 25 in both, and they are the same number for a reason: the floor is the oldest Java a consumer may
# be on, and this repository's only consumer is its own container. kvadrant-ui, which :shared-ui
# compiles against, is on 25 as well.
sborka.jvmToolchain=25
sborka.jvmFloor=25

# Not the default, and not for the reason this line used to give — kvadrant is under
# `io.github.youndie` now and the conventions' own filter reaches it, so nothing here is about
# groups. What needs this is `wasmJs`: the Kotlin plugin declares the repository for the Node
# distribution itself, on the project — `Distributions at https://nodejs.org/dist`, reported as
# "added by unknown code" — and `org.nodejs:node` is only there. `FAIL_ON_PROJECT_REPOS` fails the
# build on that repository; `PREFER_SETTINGS` ignores it and then cannot find node at all (checked,
# both of them). `PREFER_PROJECT` is the one that leaves the plugin able to fetch its own toolchain.
sborka.repositoriesMode=PREFER_PROJECT
