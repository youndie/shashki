# What this repository decides for itself. Everything several repositories have to agree on — Kotlin,
# coroutines, serialization, Ktor's version, Compose, KSP, JUnit — comes from the shared `wip`
# catalog instead, reached as `wip.…` beside this one.
#
# Nothing is declared here before something reads it. A version nobody resolves is a number nobody
# has checked, and it goes stale silently.

[versions]
# The convention plugins. The settings plugin is versioned in `settings.gradle.kts`; these are the
# project half, and they need a version here because the root build has to put them on the plugin
# classpath — see the note there.
sborka = "0.1.0.23"

# Ktor's own version is `wip.versions.ktor`; these are the artefacts, which the shared catalog does
# not carry because which of them a service needs is the service's business.
logback = "1.5.20"
# The saga engine; petich-postgres pins Exposed 1.4.0 in its own POM, so that number is not ours to
# choose — a different one here is a version conflict, not a preference.
petich = "0.1.0.10"
exposed = "1.4.0"
hikari = "7.1.0"
postgresql = "42.7.13"
flyway = "13.3.0"
testcontainers = "1.21.4"
# The PKCE hash and the verifier's randomness. Chosen because shildik verifies with this same
# library, and because it publishes `wasm-js` variants of core, random and the WebCrypto provider —
# checked in the Maven Central listing, not assumed.
# Routing, embedded in the server rather than beside it: Apache-2.0, a plain Java library. The same
# 11.0 B-06 measured the import with, so the four-second number belongs to this version.
# **A timestamped snapshot, pinned by build metadata.** smtpkn has released nothing — only
# `0.1.0-SNAPSHOT` exists — so B-13's documented fallback applies: pin the resolved build rather than
# the moving coordinate. Published 2026-08-09; these cannot change under the build.
smtpkn = "0.1.0-20260902.062954-3"
# **And it is two numbers, not one — twice now.** The 2026-08-09 publish left `smtp-transport-ktor`
# at build 1 with the others at 2; the 2026-09-02 one left it at 2 with the others at 3. A single
# version reference across the set does not resolve, loudly, with "could not find" — which is the good
# case. B-13's fallback quietly assumes one build number per publish, and this library has now
# disproved that on both of its publishes.
smtpknTransport = "0.1.0-20260902.062954-2"
graphhopper = "11.0"
cryptography = "0.6.0"
# **Every Compose artefact this repository names by hand rides this one reference**, and
# shared-ui/build.gradle.kts checks it against the version the plugin applies. Compose 1.12 deprecated
# the `compose.runtime` / `compose.foundation` / `compose.ui` / `compose.uiTest` accessors in favour
# of naming the artefacts — which trades a warning for a number that can drift, so the number is
# guarded. The name is historical: it was `ui-test` alone until B-27.
composeUiTest = "1.12.0"
# Server-driven UI. A CI-numbered publish, not a `-SNAPSHOT`.
# Navigation 3 for Compose Multiplatform. **An alpha, and the only line published for `wasmJs`** —
# pinned like everything else, but pre-release quality, and the runtime half comes from Google's
# repository rather than Maven Central.
navigation3 = "1.2.0-alpha02"
# The OIDC surface as `@Resource` classes, so a browser client does not build the path from strings.
# The wasmJs target arrived with youndie/shildik#20.
shildik = "0.2.0.13"
# katcher's own wire types. The browser target arrived with youndie/katcher#32.
katcher = "0.6.40"
kompot = "0.34.1.101"
kvadrant = "0.2.0"
viddik = "0.3.3.19"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio" }
ktor-server-contentNegotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-server-statusPages = { module = "io.ktor:ktor-server-status-pages" }
ktor-server-callLogging = { module = "io.ktor:ktor-server-call-logging" }
ktor-server-testHost = { module = "io.ktor:ktor-server-test-host" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json" }
ktor-server-resources = { module = "io.ktor:ktor-server-resources" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation" }
ktor-client-resources = { module = "io.ktor:ktor-client-resources" }
ktor-client-core = { module = "io.ktor:ktor-client-core" }
# The engine a test substitutes for the real one, so a crash report can be asserted without a server.
ktor-client-mock = { module = "io.ktor:ktor-client-mock" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio" }
# Typed routes, declared once in :protocol and read by both sides. Publishes wasmJs and jvm — checked
# against the module metadata before it was added, because a KMP module cannot depend on a JVM-only
# artefact and the failure would name a variant rather than the reason.
ktor-resources = { module = "io.ktor:ktor-resources" }

petich-core = { module = "io.github.youndie:petich-core", version.ref = "petich" }
petich-postgres = { module = "io.github.youndie:petich-postgres", version.ref = "petich" }
petich-outboxCore = { module = "io.github.youndie:petich-outbox-core", version.ref = "petich" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
exposed-migrationJdbc = { module = "org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
koin-ktor = { module = "io.insert-koin:koin-ktor" }
koin-loggerSlf4j = { module = "io.insert-koin:koin-logger-slf4j" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }

logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

kvadrant-core = { module = "io.github.youndie:kvadrant-core", version.ref = "kvadrant" }

navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-composeViewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-composeNavigation3 = { module = "io.insert-koin:koin-compose-navigation3" }
ktor-client-js = { module = "io.ktor:ktor-client-js" }

katcher-shared = { module = "ru.workinprogress.katcher:shared", version.ref = "katcher" }

shildik-sharedOidc = { module = "ru.workinprogress.shildik:shared-oidc", version.ref = "shildik" }

kompot-standard = { module = "io.github.youndie:kompot-standard", version.ref = "kompot" }

kompot-client = { module = "io.github.youndie:kompot-client", version.ref = "kompot" }
kompot-core = { module = "io.github.youndie:kompot-core", version.ref = "kompot" }
kompot-registryAnnotations = { module = "io.github.youndie:kompot-registry-annotations", version.ref = "kompot" }
kompot-registryProcessor = { module = "io.github.youndie:kompot-registry-processor", version.ref = "kompot" }

# Compose's UI test harness, named directly rather than through `compose.uiTest` — that accessor is
# deprecated in 1.12 ("specify dependency directly") and the deprecation only surfaced on a clean
# build, because a warm configuration cache never re-evaluated the script. The version rides
# `wip.versions.composeMultiplatform`, so it cannot drift from the Compose the plugin applies.
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeUiTest" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeUiTest" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeUiTest" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeUiTest" }

smtpkn-client = { module = "io.github.youndie:smtp-client", version.ref = "smtpkn" }
smtpkn-transportKtor = { module = "io.github.youndie:smtp-transport-ktor", version.ref = "smtpknTransport" }
smtpkn-tlsJvm = { module = "io.github.youndie:smtp-tls-jvm", version.ref = "smtpkn" }
smtpkn-mime = { module = "io.github.youndie:smtp-mime", version.ref = "smtpkn" }
smtpkn-sasl = { module = "io.github.youndie:smtp-sasl", version.ref = "smtpkn" }

graphhopper-core = { module = "com.graphhopper:graphhopper-core", version.ref = "graphhopper" }

cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-random = { module = "dev.whyoleg.cryptography:cryptography-random", version.ref = "cryptography" }
cryptography-provider-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptography" }
cryptography-provider-webcrypto = { module = "dev.whyoleg.cryptography:cryptography-provider-webcrypto", version.ref = "cryptography" }

