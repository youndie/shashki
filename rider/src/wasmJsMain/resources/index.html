<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--
      **`base` is what makes a deep link work.** Every URL on this page is relative — the script, and
      the two `.wasm` files the script asks for — and a relative URL resolves against the *document's*
      address. Opened at `/trip/ride-1` the browser therefore asked for `/trip/rider.js`, which the
      static route answered with this very page: an HTML file served as JavaScript, no application,
      and a blank window. B-28 promised that `/trip/{id}` is a real address; this is the line that
      keeps the promise.
    -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>shashki</title>
    <!--
      The page the bundle is loaded from, which until B-35 did not exist: the wasm compiled, the
      goldens were taken on the desktop target, and nothing had ever opened either bundle in a
      browser. There was no HTML to open.

      `config.js` is the page contract B-28 named — the deployment's values, injected by whoever
      serves the page, so the bundle stays the same bytes everywhere. Absolute, because the driver's
      page lives under /driver and there is one server answering for both.
    -->
    <style>
        html, body { margin: 0; height: 100%; background: #0A0A0A; overscroll-behavior: none; }
    </style>
</head>
<body>
<script src="/config.js"></script>
<script type="application/javascript" src="rider.js"></script>
</body>
</html>
